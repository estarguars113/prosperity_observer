[package]
name = "prosperity_lakehouse"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.14", features = ["yaml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
deltalake = { version = "0.18", features = ["default", "datafusion", "json"] }
arrow = "51.0"
parquet = "51.0"
chrono = { version = "=0.4.37", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
futures = "0.3"
tokio-retry = "0.3"

[dev-dependencies]
tokio-test = "0.4"