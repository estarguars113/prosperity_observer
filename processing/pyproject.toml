[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosperity-processing"
dynamic = ["version"]
description = "Data processing, validation, and exploration for the Prosperity Lakehouse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
    "deltalake>=0.18.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gx = ["great-expectations>=1.0.0"]
explore = ["jupyterlab>=4.0.0", "ipykernel>=6.29.0", "matplotlib>=3.8.0", "seaborn>=0.13.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "prosperity-processing[gx,explore]",
]

[project.scripts]
prosperity-process = "prosperity_processing.cli:app"

[tool.hatch.version]
path = "src/prosperity_processing/__init__.py"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
